services:
  # 1. Backend WebSocket & REST Server
  - type: web
    name: pulsechat-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: pulsechat-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: pulsechat-redis
          property: connectionString

  # 2. Frontend Web Application (React + Vite)
  - type: web
    name: pulsechat-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_WS_URL
        fromService:
          type: web
          name: pulsechat-api
          property: host
          value: wss://pulsechat-api.onrender.com/ws
      - key: VITE_API_URL
        fromService:
          type: web
          name: pulsechat-api
          property: host
          value: https://pulsechat-api.onrender.com

databases:
  - name: pulsechat-db
    plan: free
    databaseName: pulsechat
    user: pulsechat_admin

# Managed Redis Pub/Sub
redis:
  - name: pulsechat-redis
    plan: free
    ipAllowList: [] # internal access only
